<html>
<head>
    <title>Solace Apparel</title>
    <style>
        body {
            background-color: #dcdcce;
            margin: 0;
            font-family: times, sans-serif;
        }

        /* HEADER */
        .header {
            display: flex;
            align-items: center;
            background-color: #0b3003;
            padding: 4px 10px;
        }

        .logo img {
            width: 150px; 
        }

        .navigation {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px; /* cleaner spacing */
        }

        .navigation a,
        .dropdown > a {
            color: #e3ddc1;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            padding: 4px 8px;
            display: inline-block;
        }

        /* DROPDOWN */
        .dropdown {
            position: relative;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #e3ddc1;
            min-width: 160px;
            box-shadow: 0px 2px 6px rgba(0,0,0,0.3);
            z-index: 20;
            
            top: 100%;
            left: 50%;
            transform: translateX(-50%); /* keeps dropdown centered */
        }


        .dropdown-content a {
            color: #0b3003;
            padding: 10px 15px;
            display: block;
            font-size: 13px;
            text-decoration: none;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        /* ----------- MAIN SECTION STYLING ----------- */

        .categories-section {
            text-align: center;
            padding: 50px 20px;
        }

        .categories-section h1 {
            font-size: 38px;
            color: #0b3003;
            margin-bottom: 10px;
        }

        .categories-section p {
            font-size: 15px;
            color: #364229;
            margin-bottom: 40px;
        }

        .categories {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        .category-box {
            text-align: center;
        }

        .category-card {
            width: 240px;
            height: 300px;
            border-radius: 12px;
            overflow: hidden;
            display: block;
            position: relative;
            text-decoration: none;
        }

        .category-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .category-text {
            position: absolute;
            bottom: 0;
            width: 100%;
            padding: 12px 15px;
            color: #fff;
            font-size: 20px;
            display: flex;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.3);
        }

    

        /* FOOTER */
        .footer {
            background-color: #0b3003;
            color: #e3ddc1;
            text-align: center;
            padding: 15px 10px;
            font-size: 14px;
            margin-top: 20px;
        }
        .footer a {
            color: #e3ddc1;
            text-decoration: none;
            margin: 0 8px;
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="header">
        <div class="logo">
            <img src="solacelogo.png" alt="Solace Logo">
        </div>

        <div class="navigation">
            <a href="signup.html">Sign Up</a>
            <a href="login.html">Login</a>
            <a href="home.html">Home</a>

            <!-- Collections Dropdown -->
            <div class="dropdown">
                <a href="collections.html">Collections</a>
                <div class="dropdown-content">
                    <a href="women.html">Women</a>
                    <a href="men.html">Men</a>
                    <a href="others.html">Others</a>
                </div>
            </div>

            <a href="new.html">New Arrivals</a>
            <a href="sale.html">Sale</a>

            <!-- About Dropdown -->
            <div class="dropdown">
                <a href="about.html">About</a>
                <div class="dropdown-content">
                    <a href="storelocator.html">Store Locator & Hours</a>
                    <a href="customerservice.html">Customer Services</a>
                </div>
            </div>

            <a href="cart.html">Cart</a>
        </div>
    </div>

    <!-- MAIN SECTION--->
    <section class="categories-section">

        <h1>Find your Solace.</h1>
        <p>
            explore our latest collections filled with luxury…<br>
            CURATED TO YOUR CLOSET.
        </p>

        <div class="categories">

            <!-- MEN CARD -->
            <div class="category-box">
                <a href="Men.html" class="category-card">
                    <img src="homeimage(2).jpg" alt="Men">
                    <div class="category-text">
                        <span>Men</span>
                        <span>></span>
                    </div>
                </a>
            </div>

            <!-- WOMEN CARD -->
            <div class="category-box">
                <a href="Women.html" class="category-card">
                    <img src="homeimage.jpg" alt="Women">
                    <div class="category-text">
                        <span>Women</span>
                        <span>></span>
                    </div>
                </a>
            </div>

            <!-- OTHERS CARD -->
            <div class="category-box">
                <a href="Others.html" class="category-card">
                    <img src="homeimage (1).jpg" alt="Others">
                    <div class="category-text">
                        <span>Others</span>
                        <span>></span>
                    </div>
                </a>
          </div>
       </div>
    </section>





     <!-- FOOTER -->
    <div class="footer">
        <p>
            <a href="about.html">About Us</a> |
            <a href="tos.html">Terms & Conditions</a> |
            <a href="customerservice.html">Contact</a>
        </p>
    </div>

</body>
</html>
